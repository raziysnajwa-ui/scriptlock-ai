<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptLock AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
    }

    p {
      text-align: center;
      color: #aaa;
    }

    .box {
      background: #151520;
      padding: 25px;
      border-radius: 16px;
      margin-top: 30px;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      box-sizing: border-box;
      background: #0d0d15;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #0d0d15;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 ScriptLock AI</h1>

    <p>Turn your script into a video.</p>

    <div class="box">

      <textarea id="script" placeholder="Paste your script here..."></textarea>

      <button onclick="generateVideo()">
        Generate Video
      </button>

      <div id="result"></div>

    </div>

  </div>

  <script>
    function generateVideo() {
      const script = document.getElementById("script").value.trim();
      const result = document.getElementById("result");

      result.style.display = "block";

      if (!script) {
        result.innerHTML = "⚠️ Please paste your script first.";
        return;
      }

      result.innerHTML =
        "✅ Script received! ScriptLock AI is ready for the video-generation connection.";
    }
  </script>

</body>
</html>
