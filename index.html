<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptLock AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #a0a0b0;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: #141421;
      border: 1px solid #33334d;
      border-radius: 12px;
      padding: 16px;
      color: white;
      font-size: 16px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #7c3aed;
    }

    button:disabled {
      background: #4c4c66;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      font-size: 15px;
    }

    video {
      margin-top: 20px;
      width: 100%;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ScriptLock AI</h1>
    <p>Turn your script into a video</p>

    <textarea id="scriptInput" placeholder="Type or paste your video script here..."></textarea>
    <button id="generateBtn" onclick="generateVideo()">Generate Video</button>

    <div id="result"></div>
    <video id="videoPlayer" controls></video>
  </div>

  <script>
    async function generateVideo() {
      const scriptInput = document.getElementById('scriptInput');
      const generateBtn = document.getElementById('generateBtn');
      const resultDiv = document.getElementById('result');
      const videoPlayer = document.getElementById('videoPlayer');

      const scriptText = scriptInput.value.trim();

      if (!scriptText) {
        resultDiv.innerHTML = "<span style='color: #ef4444;'>Please enter a script first.</span>";
        return;
      }

      generateBtn.disabled = true;
      resultDiv.innerHTML = "<span style='color: #a0a0b0;'>Generating video, please wait...</span>";
      videoPlayer.style.display = "none";

      try {
        const response = await fetch('https://pretty-bushes-end.loca.lt/generate-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: scriptText })
        });

        if (!response.ok) {
          throw new Error('API request failed');
        }

        const data = await response.json();

        resultDiv.innerHTML = "<span style='color: #22c55e;'>✓ Video generated successfully!</span>";
        if (data.video_url) {
          videoPlayer.src = data.video_url;
          videoPlayer.style.display = "block";
        }
      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = "<span style='color: #ef4444;'>Error generating video. Make sure your Colab backend is running!</span>";
      } finally {
        generateBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
