<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptLock AI</title>
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
    }

    p {
      text-align: center;
      color: #aaa;
    }

    .box {
      background: #151520;
      padding: 25px;
      border-radius: 16px;
      margin-top: 30px;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      box-sizing: border-box;
      background: #0d0d15;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #6d28d9;
    }

    button:disabled {
      background: #4c1d95;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #0d0d15;
      border-radius: 10px;
      display: none;
    }

    #videoPlayer {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ScriptLock AI</h1>
    <p>Turn your script into a video.</p>

    <div class="box">
      <textarea id="script" placeholder="Paste your script here..."></textarea>
      <button id="generateBtn" onclick="generateVideo()">Generate Video</button>
      
      <div id="result"></div>
      <video id="videoPlayer" controls></video>
    </div>
  </div>

  <script>
    async function generateVideo() {
      const scriptInput = document.getElementById('script').value.trim();
      const resultDiv = document.getElementById('result');
      const videoPlayer = document.getElementById('videoPlayer');
      const generateBtn = document.getElementById('generateBtn');

      if (!scriptInput) {
        resultDiv.style.display = "block";
        resultDiv.innerHTML = "⚠️ Please enter a script before generating.";
        resultDiv.style.color = "#f87171";
        return;
      }

      // Update UI for loading state
      resultDiv.style.display = "block";
      resultDiv.style.color = "#4ade80";
      resultDiv.innerHTML = "⏳ Processing script and generating video. Please wait...";
      generateBtn.disabled = true;
      videoPlayer.style.display = "none";

      try {
        /* 
           BACKEND API INTEGRATION PLACEHOLDER:
           Since GitHub Pages hosts static files, you must route your request to an external server.
           Example endpoint targeting a backend running on Modal, Google Colab, or Render:
        */
        const API_ENDPOINT = "https://your-backend-api-url.com/generate";

        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: scriptInput })
        });

        if (!response.ok) {
          throw new Error('API request failed');
        }

        const data = await response.json();

        // Display the generated video
        resultDiv.innerHTML = "✅ Video generated successfully!";
        videoPlayer.src = data.video_url; 
        videoPlayer.style.display = "block";

      } catch (error) {
        // Mock success fallback for offline or testing purposes
        console.warn("API call failed or endpoint not set. Showing temporary demo status.");
        resultDiv.innerHTML = "✔️ Script received! Connect your video generation API to render output.";
      } finally {
        generateBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
